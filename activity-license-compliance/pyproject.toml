[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "activity-license-compliance"
version = "0.6.0"
description = "Activity/Subject/Constraint audit and relay Responses experiments"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
activity-license = "license_checker.cli:main"

[tool.setuptools.packages.find]
include = ["license_checker*"]

[tool.setuptools.package-data]
license_checker = ["resources/*.json", "resources/*.txt", "resources/*.html"]
